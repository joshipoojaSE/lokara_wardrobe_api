# Local development only. Production uses a managed database and deploys the
# image built from Dockerfile; neither service here runs in production.
#
#   docker compose up -d               # Postgres only (run uvicorn from the venv)
#   docker compose --profile api up    # Postgres + API in its real image
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lokara_wardrobe}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create_test_db.sh:/docker-entrypoint-initdb.d/create_test_db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["api"]
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - path: .env
        required: false
    environment:
      # Set after env_file so these win: inside the network the host is `db`.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-lokara_wardrobe}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-lokara_wardrobe}_test
    ports:
      - "8000:8000"
    volumes:
      - ./app:/srv/app/app
      - ./alembic:/srv/app/alembic
      - ./tests:/srv/app/tests
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
